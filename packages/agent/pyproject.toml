[project]
name = "homework-print-bot-agent"
version = "0.1.0"
description = "AgentCore agents for homework print generation and grading"
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore[strands-agents]>=1.0.3",
    "strands-agents>=1.13.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "playwright>=1.48.0",
    "python-ulid>=4.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
